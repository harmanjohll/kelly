# Publishes Kelly's Learning Studio (the learning/ folder only) to GitHub Pages.
# The floral site at the repo root deploys separately to Cloudflare Pages and is untouched.
# One time setup: repo Settings > Pages > Source: "GitHub Actions".
name: Learning Studio to Pages

on:
  push:
    branches: [main]
    paths: ['learning/**', '.github/workflows/learning-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: learning-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate content
        run: node learning/docs/validate.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: learning
      - id: deployment
        uses: actions/deploy-pages@v4
