# The one GitHub Pages deploy for this repo. A repo has a single Pages site, so every
# project is assembled into it here; a second Pages workflow would overwrite this one.
#   https://harmanjohll.github.io/kelly/          learning/  (Kelly's Learning Studio, static)
#   https://harmanjohll.github.io/kelly/floral/   floral/    (Kelly's floral studio, Astro build)
# One time setup: repo Settings > Pages > Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: floral/package-lock.json

      - id: pages
        uses: actions/configure-pages@v5

      - name: Check the Learning Studio content
        run: node learning/docs/validate.js

      - name: Build the floral site
        working-directory: floral
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/floral
        run: |
          npm ci
          npm test
          npm run build

      - name: Assemble the Pages site
        run: |
          mkdir -p _site
          cp -r learning/. _site/
          mkdir -p _site/floral
          cp -r floral/dist/. _site/floral/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
