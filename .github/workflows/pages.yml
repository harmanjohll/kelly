# Builds every app and publishes them together to GitHub Pages.
# The floral site is served at the root of the Pages address (https://harmanjohll.github.io/kelly/).
# To publish another app, add a build step below and copy its output into _site/<app-name>/.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/floral/package-lock.json

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build the floral site
        working-directory: apps/floral
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          npm ci
          npm test
          npm run build

      - name: Assemble the Pages site
        run: |
          mkdir -p _site
          cp -r apps/floral/dist/. _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
