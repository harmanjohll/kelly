# GitHub Pages runs this Jekyll build on every push to main
# (Settings > Pages > Source: Deploy from a branch > main, / (root)).
# The sites here are already built HTML, so Jekyll only copies them; these lines keep
# project source code and notes off the public site.
exclude:
  - README.md
  - CLAUDE.md
  - floral/source
  - learning/docs
  - learning/CLAUDE.md
  - learning/package.json
