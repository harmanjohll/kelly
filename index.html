<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kelly</title>
  <style>
    :root { color-scheme: light dark; --bg: #f1f2ec; --fg: #18221d; --muted: #4a554e; --line: #c6ccc1; }
    @media (prefers-color-scheme: dark) { :root { --bg: #121814; --fg: #e8eae3; --muted: #a9b2ab; --line: #2f3a33; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 17px/1.6 Georgia, serif; padding: 24px; box-sizing: border-box; }
    main { max-width: 32rem; width: 100%; }
    h1 { font-weight: normal; font-style: italic; font-size: 3rem; margin: 0 0 1.5rem; }
    a { display: block; color: inherit; text-decoration: none; border-top: 1px solid var(--line); padding: 1rem 0; font-size: 1.4rem; }
    a span { display: block; font: 15px/1.5 system-ui, sans-serif; color: var(--muted); }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>Kelly</h1>
    <a href="floral/">Floral studio<span>Fresh flowers for the week, crochet flowers to keep</span></a>
    <a href="learning/">Learning Studio<span>Ideas, connections and English practice</span></a>
  </main>
</body>
</html>
